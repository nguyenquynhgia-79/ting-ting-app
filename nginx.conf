server {
    listen 80;
    server_name api.tingting.com; # Thay đổi thành domain của bạn

    # Redirect tất cả traffic HTTP sang HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.tingting.com; # Thay đổi thành domain của bạn

    # Đường dẫn tới chứng chỉ SSL (sử dụng Let's Encrypt hoặc cung cấp chứng chỉ riêng)
    ssl_certificate /etc/letsencrypt/live/api.tingting.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tingting.com/privkey.pem;
    
    # Cấu hình bảo mật SSL (ví dụ cấu hình an toàn)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";

    # Cấu hình header an toàn bổ sung
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # Proxy tới backend Node.js
    location / {
        proxy_pass http://localhost:3000; # Thay đổi nếu Node.js app chạy port khác
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Forward IP thực của client (để AuditLog lấy đúng IP)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
